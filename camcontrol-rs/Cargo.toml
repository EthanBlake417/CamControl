[package]
name = "camcontrol"
version = "0.1.0"
edition = "2024"
description = "CamControl in Rust: live view, camera controls and capture (experimental port)"

[dependencies]
ab_glyph = "0.2.32"
chrono = "0.4"
eframe = { version = "0.31", features = ["persistence"] }
epaint_default_fonts = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg", "bmp"] }
imageproc = { version = "0.25", default-features = false }
mozjpeg = "0.10"
mp4 = "0.14.0"
nokhwa = { version = "0.10", features = ["input-native"] }
openh264 = "0.9.8"
png = "0.18"
rfd = "0.15"
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tiff = "0.11"
tiny-skia = "0.12.0"
trash = "5.2.9"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_DirectShow", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["eframe", "wgpu"] }

[build-dependencies]
winresource = "0.1.34"
